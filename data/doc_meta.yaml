# One entry per corpus file.
#   PDF:  `file` is relative to data/ (`pdfs/<name>`).
#   HTML: `file` is relative to the repo root (`html/<name>`).
# The Chrome view-source saves in data/html/ are the input to
# scripts/fetch_listing_html.py. They are not corpus files and have no entry here.
#
# doc_type
#   listing          short brochure or web page about one property (about 10 pages or less)
#   single_asset_om  longer offering memorandum about one property or one small portfolio
#   fund_om          offering memorandum of a fund, REIT, or issuer (the offering is the fund)
#   other            anything else (investor deck, securitisation notes)
#
# as_of: YYYY-MM-DD, or YYYY-MM when only the month is known.
#   "# from text"      the date is printed in the document
#   "# from PDF meta"  PDF creation date, used because the document prints none. Confirm or fix.
#   "# TODO"           I could not settle this. Check the first pages.
#
# source_url is required for html entries, optional for pdf entries.
# `versions:` splits one PDF into logical versions (see tasks/hw02-plan.md, Phase 2).
# Generated skeleton. Every value is a proposal until you have reviewed it.

